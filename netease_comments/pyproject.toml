[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netease-comments"
version = "0.1.0"
description = "NetEase Cloud Music comments crawler SDK (weapi reverse-engineered)."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "anon" }]
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pycryptodome>=3.20",
]

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13"]

[project.scripts]
netease-comments = "netease_comments.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
